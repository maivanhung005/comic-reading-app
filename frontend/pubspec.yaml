name: comic_reading_app
description: Smart Comic Reader - Flutter MVVM + Clean Architecture with Spring Boot and PostgreSQL.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  dio: ^5.4.3+1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  flutter_tts: ^4.0.2
  file_picker: ^8.1.7
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
