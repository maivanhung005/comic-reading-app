server.port=8080
spring.application.name=comic-reading-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/comic_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=300MB
app.upload.dir=uploads
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=604800000
app.payment.momo.partner-code=MOMO_SANDBOX_NHOM5
app.payment.zalopay.app-id=ZALOPAY_SANDBOX_NHOM5
springdoc.swagger-ui.path=/swagger-ui.html

# Gmail SMTP: dùng Gmail App Password, không dùng mật khẩu Gmail thường.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Tài khoản Admin bootstrap chỉ được tạo khi chủ máy chủ bật biến môi trường tương ứng.
# Không lưu mật khẩu Admin vào application.properties hoặc repository.
app.security.bootstrap-admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.security.bootstrap-admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.security.bootstrap-admin.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.security.bootstrap-admin.name=${ADMIN_BOOTSTRAP_NAME:}
app.security.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
